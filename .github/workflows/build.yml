name: 测试与打包

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "构建通过后发布正式版本（按 wenzhen/__init__.py 中的版本号创建 v 标签和发布页）"
        type: boolean
        default: false
      source_ref:
        description: "要打包的提交或标签（留空为所选分支的最新提交；补发历史版本时填写该版本的提交）"
        type: string
        default: ""
      remove_release:
        description: "要删除的旧版本标签（如 v1.1.0），发布页和标签一并删除；勾选了发布时，新版本发布成功后才删除"
        type: string
        default: ""

# 手动运行（发布）与推送触发的构建分开排队，互不取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    name: Windows 安装程序
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements-desktop.txt pyinstaller
      - name: 读取版本号
        id: version
        shell: bash
        run: echo "version=$(python -c 'import wenzhen; print(wenzhen.__version__)')" >> "$GITHUB_OUTPUT"
      - name: 下载 WebView2 运行库安装程序（随安装包附带）
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging\MicrosoftEdgeWebview2Setup.exe
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          if (-not (Test-Path $key)) {
            Write-Host "测试机没有 WebView2，先安装"
            Start-Process packaging\MicrosoftEdgeWebview2Setup.exe -ArgumentList "/silent", "/install" -Wait
          }
      - name: 从源码运行冒烟测试（与打包后的程序对照）
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke-source"
          $p = Start-Process -FilePath python -ArgumentList "-m", "wenzhen", "--smoke-test", "--data-dir", $dir -PassThru -Wait -NoNewWindow
          Get-Content (Join-Path $dir "logs\wenzhen.log") -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "从源码运行失败，退出码 $($p.ExitCode)" }
      - name: 打包程序
        run: pyinstaller --noconfirm --clean packaging/wenzhen.spec
      - name: 冒烟测试：打开窗口、检查页面后自动退出
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath "dist\Wenzhen\Wenzhen.exe" -ArgumentList "--smoke-test", "--data-dir", $dir -PassThru -Wait
          Get-Content (Join-Path $dir "logs\wenzhen.log") -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "冒烟测试失败，退出码 $($p.ExitCode)" }
      - name: 生成安装程序
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "安装程序生成失败" }
      - name: 安装程序测试：静默安装后运行
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\WenzhenClinic-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\WenzhenClinic\Wenzhen.exe"
          if (-not (Test-Path $exe)) { throw "安装后找不到 $exe" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "王艳霞中医门诊\王艳霞中医门诊.lnk"
          if (-not (Test-Path $shortcut)) { throw "开始菜单中没有快捷方式" }
          $dir = Join-Path $env:RUNNER_TEMP "smoke-installed"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test", "--data-dir", $dir -PassThru -Wait
          Get-Content (Join-Path $dir "logs\wenzhen.log") -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "安装后的程序运行失败，退出码 $($p.ExitCode)" }
      - name: 绿色版压缩包（免安装）
        shell: pwsh
        run: Compress-Archive -Path dist\Wenzhen -DestinationPath "dist\WenzhenClinic-Portable-${{ steps.version.outputs.version }}-Windows.zip"
      - name: 故障诊断：系统事件日志中的程序崩溃记录
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in ".NET Runtime", "Application Error", "Windows Error Reporting" } |
            Select-Object -First 6 | Format-List TimeCreated, ProviderName, Message
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/WenzhenClinic-Setup-*.exe
            dist/WenzhenClinic-Portable-*.zip
          if-no-files-found: error

  macos:
    name: macOS 应用
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements-desktop.txt pyinstaller
      - name: 打包程序
        run: pyinstaller --noconfirm --clean packaging/wenzhen.spec
      - name: 冒烟测试：打开窗口、检查页面后自动退出
        timeout-minutes: 5
        run: |
          status=0
          "dist/王艳霞中医门诊.app/Contents/MacOS/Wenzhen" --smoke-test --data-dir "$RUNNER_TEMP/smoke" || status=$?
          cat "$RUNNER_TEMP/smoke/logs/wenzhen.log"
          exit $status
      - name: 压缩
        run: |
          version=$(python -c 'import wenzhen; print(wenzhen.__version__)')
          cd dist && ditto -c -k --sequesterRsrc --keepParent "王艳霞中医门诊.app" "WenzhenClinic-${version}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/WenzhenClinic-*-macOS.zip
          if-no-files-found: error

  # 发布：推送 v* 标签，或手动运行本流程并勾选“发布正式版本”（由 Actions 创建标签）。
  # 分两步：Windows 安装包测试通过即发布；macOS 版构建完成后再附到同一发布页，
  # 这样 macOS 构建机排队时不会耽误 Windows 版发布。
  release:
    name: 发布（Windows）
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: 确定版本标签
        id: tag
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' wenzhen/__init__.py)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与程序版本 $version 不一致"; exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts
      - name: 创建发布（标签不存在时在所打包的提交上创建）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          sed "s/{{VERSION}}/${TAG#v}/g" packaging/release-notes.md > notes.md
          # 补发的历史版本不能顶替更新的版本成为“最新版本”
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$newest" != "${TAG#v}" ]; then flag=--latest=false; else flag=--latest; fi
          echo "当前最新版本：${latest:-无}；本次发布 $TAG（$flag）"
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$SHA" "$flag" \
            --title "王艳霞中医门诊 $TAG" --notes-file notes.md

  release-macos:
    name: 发布（附上 macOS 版）
    needs: [macos, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts
      - name: 上传到发布页
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  # 删除旧版本（发布页与标签）。同时发布新版本时，新版本发布成功后才删除。
  remove-release:
    name: 删除旧版本
    needs: release
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.remove_release != '' &&
      (needs.release.result == 'success' || !inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 删除发布页和标签
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ inputs.remove_release }}
          NEW: ${{ needs.release.outputs.tag }}
        run: |
          case "$OLD" in
            v[0-9]*) ;;
            *) echo "::error::“$OLD” 不是版本标签（应形如 v1.1.0）"; exit 1 ;;
          esac
          if [ "$OLD" = "$NEW" ]; then echo "::error::不能删除刚发布的 $NEW"; exit 1; fi
          gh release delete "$OLD" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "已删除 $OLD 的发布页和标签"
