{% extends "base.html" %}
{% block title %}出错了{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center">
  {% if error.code == 404 %}
    <h1>页面不存在</h1>
    <p class="muted" style="margin-top:8px">要找的记录可能已被删除。</p>
  {% else %}
    <h1>请求无法处理</h1>
    <p class="muted" style="margin-top:8px">{{ error.description }}</p>
  {% endif %}
  <p style="margin-top:16px"><a class="btn" href="{{ url_for('main.index') }}">返回工作台</a></p>
</div>
{% endblock %}
